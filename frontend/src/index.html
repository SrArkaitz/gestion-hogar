<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gestión del Hogar</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica el tema guardado antes de pintar, para que no parpadee (ver core/theme.service.ts).
    (function () {
      var t; try { t = localStorage.getItem('hogar.tema'); } catch (e) {}
      var dark = t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
