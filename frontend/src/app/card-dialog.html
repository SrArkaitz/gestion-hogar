<div class="veil" (click)="onVeilClick($event)">
  <form class="dlg" (submit)="submit($event)" novalidate>
    <h3>{{ card() ? 'Editar tarjeta' : 'Nueva tarjeta' }}</h3>

    <label>Título
      <input #titleInput id="f-title" maxlength="120" placeholder="Ej.: Purgar los radiadores"
             [value]="title()" (input)="title.set(value($event))">
    </label>

    <label>Notas
      <textarea id="f-note" maxlength="1000" placeholder="Detalles, materiales, quién lo hace…"
                [value]="note()" (input)="note.set(value($event))"></textarea>
    </label>

    <div class="row">
      <label>Columna
        <select id="f-col" [value]="column()" (change)="column.set($any(value($event)))">
          @for (c of columns; track c.id) {
            <option [value]="c.id" [selected]="c.id === column()">{{ c.name }}</option>
          }
        </select>
      </label>

      <label>Para el
        <input id="f-due" type="date" [value]="due()" (input)="due.set(value($event))">
      </label>

      <label>Prioridad
        <div class="prio" role="group" aria-label="Prioridad">
          @for (p of priorities; track p) {
            <button type="button" [attr.data-v]="p" [attr.aria-pressed]="priority() === p"
                    (click)="priority.set(p)">{{ p | titlecase }}</button>
          }
        </div>
      </label>
    </div>

    @if (error()) {
      <div class="form-err">{{ error() }}</div>
    }

    <div class="acts">
      @if (card()) {
        <button type="button" [class]="confirmDelete() ? 'btn danger' : 'btn ghost'" (click)="onDelete()">
          {{ confirmDelete() ? '¿Seguro? Pulsa otra vez' : 'Borrar' }}
        </button>
      }
      <div class="r">
        <button type="button" class="btn ghost" (click)="cancel.emit()">Cancelar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </div>
  </form>
</div>
