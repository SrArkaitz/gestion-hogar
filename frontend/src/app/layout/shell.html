<div class="shell">
  <!-- Móvil: casa activa arriba. En escritorio va en la barra lateral. -->
  <header class="mbar">
    <app-household-switcher />
  </header>

  <nav class="nav" aria-label="Módulos">
    <a class="brand" routerLink="/">Hogar</a>
    <app-household-switcher />
    <ul>
      @for (item of nav; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
    <div class="me">
      <span>{{ session.user()?.name }}</span>
      <button type="button" class="link" (click)="logout()">Cerrar sesión</button>
    </div>
  </nav>

  <main class="page">
    <router-outlet />
  </main>
</div>
